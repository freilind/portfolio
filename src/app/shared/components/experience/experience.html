<section id="experience" class="py-20">
  <div class="section-container">
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12">
      Mi <span class="text-gradient">Experiencia</span>
    </h2>

    <div class="max-w-4xl mx-auto space-y-8">
      @for (exp of experiences(); track exp.id) {
        <div class="card hover:border-primary-500 dark:hover:border-primary-400">
          <div class="flex flex-col md:flex-row md:items-start md:justify-between mb-4">
            <div class="mb-2 md:mb-0">
              <h3 class="text-xl font-bold text-gray-900 dark:text-white">
                {{ exp.title }}
              </h3>
              <p class="text-primary-600 dark:text-primary-400 font-semibold">
                {{ exp.company }}
              </p>
            </div>
            <span class="text-sm text-gray-600 dark:text-gray-400 font-medium">
                  {{ exp.period }}
                </span>
          </div>

          <p class="text-gray-600 dark:text-gray-400 mb-4">
            {{ exp.description }}
          </p>

          <div class="flex flex-wrap gap-2">
            @for (tech of exp.technologies; track tech) {
              <span class="px-3 py-1 text-sm rounded-full bg-primary-100 dark:bg-primary-900/30 text-primary-700 dark:text-primary-300">
                    {{ tech }}
                  </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
