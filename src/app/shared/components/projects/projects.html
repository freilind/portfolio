<section id="projects" class="py-20 bg-gray-50 dark:bg-gray-800/50">
  <div class="section-container">
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12">
      Mis <span class="text-gradient">Proyectos</span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (project of projects(); track project.id) {
        <div class="card group">
          <!-- Project Image -->
          <div class="relative overflow-hidden rounded-lg mb-4 bg-gradient-to-br from-primary-500 to-secondary-500 aspect-video">
            <div class="absolute inset-0 flex items-center justify-center text-white text-4xl font-bold opacity-50">
              {{ project.title.substring(0, 2).toUpperCase() }}
            </div>
          </div>

          <!-- Project Info -->
          <h3 class="text-xl font-bold mb-2 text-gray-900 dark:text-white">
            {{ project.title }}
          </h3>
          <p class="text-gray-600 dark:text-gray-400 mb-4">
            {{ project.description }}
          </p>

          <!-- Technologies -->
          <div class="flex flex-wrap gap-2 mb-4">
            @for (tech of project.technologies; track tech) {
              <span class="px-2 py-1 text-xs rounded bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    {{ tech }}
                  </span>
            }
          </div>

          <!-- Links -->
          <div class="flex gap-3">
            @if (project.github) {
              <a
                [href]="project.github"
                target="_blank"
                rel="noopener noreferrer"
                class="flex-1 px-4 py-2 text-center rounded-lg border border-gray-300 dark:border-gray-600 hover:border-primary-500 dark:hover:border-primary-400 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-primary-500"
              >
                GitHub
              </a>
            }
            @if (project.demo) {
              <a
                [href]="project.demo"
                target="_blank"
                rel="noopener noreferrer"
                class="flex-1 px-4 py-2 text-center rounded-lg bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium focus:outline-none focus:ring-2 focus:ring-primary-500"
              >
                Demo
              </a>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
