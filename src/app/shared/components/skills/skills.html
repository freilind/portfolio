<section id="skills" class="section bg-slate-50 dark:bg-slate-900/40" aria-labelledby="skills-title">
  <div class="section-container">
    <header class="section-header">
      <p class="section-eyebrow">// 03 · stack</p>
      <h2 id="skills-title" class="section-title">Tecnologías con las que trabajo</h2>
      <p class="section-lead">Herramientas que he usado en entornos productivos.</p>
    </header>

    <div class="grid gap-4 md:gap-6 md:grid-cols-2">
      @for (group of groups; track group.id) {
        <article class="card">
          <div class="flex items-start gap-4">
            <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-primary-500 to-secondary-500 text-white shadow-lg shadow-primary-500/20">
              <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="group.icon" />
              </svg>
            </span>
            <div>
              <h3 class="text-lg font-bold text-slate-900 dark:text-white">{{ group.title }}</h3>
              <p class="text-sm text-slate-600 dark:text-slate-400">{{ group.description }}</p>
            </div>
          </div>

          <ul class="mt-6 flex flex-wrap gap-2" [attr.aria-label]="'Tecnologías de ' + group.title">
            @for (skill of group.skills; track skill) {
              <li class="chip">{{ skill }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
