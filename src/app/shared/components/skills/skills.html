<section id="skills" class="py-20">
  <div class="section-container">
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12">
      Mis <span class="text-gradient">Habilidades</span>
    </h2>

    <div class="grid-layout gap-8">
      <!-- Frontend Skills -->
      <div class="lg:col-span-6 card">
        <h3 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white flex items-center gap-3">
          <svg class="w-8 h-8 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          Frontend
        </h3>
        <div class="space-y-4">
          @for (skill of frontendSkills(); track skill.id) {
            <div>
              <div class="flex justify-between mb-2">
                <span class="font-semibold text-gray-900 dark:text-white">{{ skill.name }}</span>
                <span class="text-gray-600 dark:text-gray-400">{{ skill.level }}%</span>
              </div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                <div
                  class="h-full bg-gradient-to-r from-primary-500 to-primary-600 rounded-full transition-all duration-1000"
                  [style.width.%]="skill.level"
                ></div>
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Backend Skills -->
      <div class="lg:col-span-6 card">
        <h3 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white flex items-center gap-3">
          <svg class="w-8 h-8 text-secondary-600 dark:text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
          </svg>
          Backend
        </h3>
        <div class="space-y-4">
          @for (skill of backendSkills(); track skill.id) {
            <div>
              <div class="flex justify-between mb-2">
                <span class="font-semibold text-gray-900 dark:text-white">{{ skill.name }}</span>
                <span class="text-gray-600 dark:text-gray-400">{{ skill.level }}%</span>
              </div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                <div
                  class="h-full bg-gradient-to-r from-secondary-500 to-secondary-600 rounded-full transition-all duration-1000"
                  [style.width.%]="skill.level"
                ></div>
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Tools & Others -->
      <div class="lg:col-span-12 card">
        <h3 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white flex items-center gap-3">
          <svg class="w-8 h-8 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Herramientas & Otros
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          @for (tool of tools(); track tool) {
            <div class="flex items-center gap-3 p-4 bg-gray-100 dark:bg-gray-700/50 rounded-lg">
              <div class="w-2 h-2 bg-primary-600 dark:bg-primary-400 rounded-full"></div>
              <span class="font-medium text-gray-900 dark:text-white">{{ tool }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
