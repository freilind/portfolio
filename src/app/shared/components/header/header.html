<header class="sticky top-0 z-50 border-b border-slate-200/70 dark:border-slate-800/70 bg-white/75 dark:bg-slate-950/75 backdrop-blur-lg">
  <div class="section-container">
    <nav class="flex h-16 items-center justify-between" aria-label="Navegación principal">
      <a href="#" class="font-mono text-lg font-semibold text-slate-900 dark:text-white">
        <span class="text-primary-700 dark:text-primary-400">&lt;</span>freilin<span class="text-primary-700 dark:text-primary-400"> /&gt;</span>
      </a>

      <ul class="hidden md:flex items-center gap-8">
        @for (link of links; track link.href) {
          <li><a [href]="link.href" class="nav-link">{{ link.label }}</a></li>
        }
      </ul>

      <div class="flex items-center gap-2">
        <a href="#contact" class="hidden md:inline-flex btn-primary py-2! px-4! text-sm">Hablemos</a>

        <button
          type="button"
          (click)="toggleTheme()"
          class="icon-btn"
          [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          [attr.aria-pressed]="isDark()"
        >
          @if (isDark()) {
            <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
          <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        }
        </button>

        <button
          type="button"
          class="icon-btn md:hidden"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="mobile-menu"
          [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        >
          <svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @if (menuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            } @else {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          }
          </svg>
        </button>
      </div>
    </nav>
  </div>

  @if (menuOpen()) {
    <div id="mobile-menu" class="md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950">
      <ul class="section-container flex flex-col py-4">
        @for (link of links; track link.href) {
          <li>
            <a [href]="link.href" (click)="closeMenu()" class="block rounded-lg px-3 py-3 font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</header>
