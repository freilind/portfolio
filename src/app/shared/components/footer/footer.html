<footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950">
  <div class="section-container py-10">
    <div class="flex flex-col items-center gap-8 md:flex-row md:justify-between">
      <div class="text-center md:text-left">
        <a href="#" class="font-mono text-lg font-semibold text-slate-900 dark:text-white">
          <span class="text-primary-700 dark:text-primary-400">&lt;</span>Freilin<span class="text-primary-700 dark:text-primary-400"> /&gt;</span>
        </a>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">Backend Engineer · Java · Spring · AWS</p>
      </div>

      <nav aria-label="Navegación del pie de página">
        <ul class="flex flex-wrap justify-center gap-x-6 gap-y-2">
          @for (link of navLinks; track link.href) {
            <li>
              <a [href]="link.href" class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary-700 dark:hover:text-primary-400 transition-colors">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <ul class="flex gap-2">
        @for (social of socialLinks; track social.name) {
          <li>
            <a [href]="social.url" target="_blank" rel="noopener noreferrer" class="project-link"
               [attr.aria-label]="social.name + ' (se abre en una pestaña nueva)'">
              <svg aria-hidden="true" class="h-5 w-5" fill="currentColor" [attr.viewBox]="social.viewBox">
                @for (d of social.paths; track $index) {
                  <path [attr.d]="d" />
                }
              </svg>
            </a>
          </li>
        }
      </ul>
    </div>

    <p class="mt-8 border-t border-slate-200 dark:border-slate-800 pt-6 text-center text-sm text-slate-600 dark:text-slate-400">
      &copy; {{ currentYear }} Freilin Manzano · Hecho con Angular y Tailwind CSS
    </p>
  </div>
</footer>
